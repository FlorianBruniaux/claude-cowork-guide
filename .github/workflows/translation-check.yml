name: Translation Sync Check

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths:
      - '**.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/translation-check.yml'
      - '!TRANSLATIONS.md'
  pull_request:
    paths:
      - '**.md'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/translation-check.yml'
      - '!TRANSLATIONS.md'

jobs:
  check-translations:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for accurate timestamps

      - name: Run content checks
        run: ./tests/test-content-checks.sh

      - name: Run translation check
        run: ./scripts/check-translations.sh

      - name: Upload check results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-check-results
          path: |
            TRANSLATIONS.md
          retention-days: 30
